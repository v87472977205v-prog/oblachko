html{background:#051513}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bgfx);pointer-events:none}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--ink);font:16px/1.45 Georgia,"Times New Roman",serif}
h1,h2,button,input,select,.btn,.chip,.m,#st,#sst,details{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h2{font-size:16px;margin:18px 0 6px}
main,section{max-width:760px;margin:0 auto;padding:14px 16px 60px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:16px;margin:4px 0}
button,.btn{padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:15px;cursor:pointer;display:inline-block;text-align:center}
button.p,.btn.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;margin:10px 0;align-items:center;flex-wrap:wrap}
.row>*{flex:1}.row>button,.row>.btn{flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.chip{flex:none;border-radius:99px;padding:7px 13px;font-size:14px}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.f{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px;margin:8px 0;cursor:pointer}
.th{flex:none;width:60px;height:60px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font:600 12px system-ui;color:var(--mute);overflow:hidden}
.th.fo{font-size:30px}
.th img{width:100%;height:100%;object-fit:cover}
.f b{font-weight:600;word-break:break-all}
.m{color:var(--mute);font-size:13px}
.no{color:var(--acc);font-family:system-ui;font-weight:700;margin-right:6px}
#st,#sst{min-height:20px;font-size:14px;color:var(--mute);word-break:break-word}.err{color:var(--bad)!important}
details{margin:10px 0;font-size:14px;line-height:1.5;color:var(--mute)}
#ask{background:var(--card);border:1px solid var(--acc);border-radius:10px;padding:10px;margin:10px 0}
#vw{position:fixed;inset:0;background:#000;z-index:9;color:#fff}
#vtop,#vbot{position:absolute;left:0;right:0;z-index:3;display:flex;align-items:center;gap:8px;padding:10px 8px;transition:opacity .2s}
#vtop{top:0;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(rgba(0,0,0,.7),transparent)}
#vbot{bottom:0;justify-content:space-around;padding-bottom:max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7))}
#vw.hide #vtop,#vw.hide #vbot,#vw.hide .ar{opacity:0;pointer-events:none}
.ib{background:none;border:0;color:#fff;width:46px;height:46px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.ib svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vt{flex:1;min-width:0}
#vname{font:600 16px system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vsub{font:13px system-ui,sans-serif;color:#ccc}
#flt{margin-top:-2px}
.pr4{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.pr4 button{padding:6px 11px;font-size:12px;border-radius:99px}
.pr4 .on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
#pl:not(.full) .pr4{display:none}
.th[data-th]:not(.ok){background:linear-gradient(100deg,var(--card) 30%,var(--line) 50%,var(--card) 70%) 0 0/200% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
#vstage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#vstage img,#vstage video{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
#vstage iframe{width:100%;height:100%;border:0;background:#fff;padding:60px 0}
.vl{text-align:center;color:#bbb;font:15px/1.5 system-ui,sans-serif;padding:20px}
.ar{position:absolute;top:50%;transform:translateY(-50%);z-index:3;background:rgba(0,0,0,.35);color:#fff;border:0;font-size:30px;width:40px;height:64px;padding:0;border-radius:8px;transition:opacity .2s}
.ar.l{left:4px}.ar.r{right:4px}
@media(hover:none){.ar{display:none}}
#vmenu{position:absolute;top:60px;right:8px;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:220px}
#vmenu button{display:block;width:100%;text-align:left;border:0;border-radius:0;background:none;padding:13px 16px;font-size:15px;color:var(--ink)}
#pick{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:flex;align-items:flex-end}
#pickl{background:var(--card);width:100%;max-height:70vh;overflow:auto;border-radius:16px 16px 0 0;padding:10px}
.pk{display:block;width:100%;text-align:left;margin:4px 0}.pk.on{border-color:var(--acc);color:var(--acc)}
.inr{animation:inr .25s ease}.inl{animation:inl .25s ease}
@keyframes inr{from{transform:translateX(70px);opacity:0}}
@keyframes inl{from{transform:translateX(-70px);opacity:0}}
#list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;-webkit-touch-callout:none;user-select:none;-webkit-tap-highlight-color:transparent}
.tile .th{position:relative;width:100%;height:auto;aspect-ratio:1;border-radius:0;font-size:15px}
.tile .th img{position:absolute;inset:0}
.tile .th.fo{font-size:40px}
.tile .tn{padding:5px 7px 2px;font:12px/1.25 system-ui,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .m{padding:0 7px 6px;font-size:11px}
.bd{position:absolute;left:5px;top:5px;background:rgba(0,0,0,.6);color:#fff;font:600 11px system-ui,sans-serif;padding:2px 6px;border-radius:6px}
.f{position:relative;-webkit-touch-callout:none;user-select:none;-webkit-tap-highlight-color:transparent}
.sel{outline:3px solid var(--acc);outline-offset:-3px}
.tile img,.f img{pointer-events:none;-webkit-user-drag:none;user-select:none}
.ck{position:absolute;right:5px;top:5px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.38);border:2px solid rgba(255,255,255,.85);color:transparent;font:700 15px/22px system-ui,sans-serif;text-align:center;z-index:2}
.ck::after{content:'';position:absolute;inset:-10px}
.f .ck{top:50%;margin-top:-13px;right:10px}
.sel .ck{background:var(--acc);border-color:var(--acc);color:var(--accink)}
#selbar{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--acc);border-radius:10px;padding:8px;margin-bottom:8px}
#selbar .m{font-weight:600;color:var(--ink);margin:2px 4px 0}
#selbar .row{margin:6px 0 0}#selbar button{padding:8px 11px;font-size:14px}
#boot{text-align:center;padding-top:70px}
#warn{background:var(--card);border:1px solid var(--bad);border-radius:10px;padding:10px;margin:10px 0;font:14px/1.5 system-ui,sans-serif}
main{padding-bottom:100px}
.i{width:22px;height:22px;display:inline-block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib2{background:none;border:0;color:var(--ink);width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
#top{position:sticky;top:0;z-index:6;background:rgba(5,21,19,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;gap:2px;padding:6px 0;margin:0 -4px}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 70% at 50% 30%,#0a2a25 0,#051513 55%,#030c0b 100%);transition:opacity .55s ease,visibility .55s}
#splash.out{opacity:0;visibility:hidden}
#splash .sc{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center}
#splash .sc::before,#splash .sc::after{content:"";position:absolute;inset:8px;border-radius:50%;border:1.5px solid #5fc3a6;opacity:0;animation:spr 2.4s ease-out infinite}
#splash .sc::after{animation-delay:1.2s}
#splash svg{width:132px;height:132px;overflow:visible;filter:drop-shadow(0 0 14px rgba(95,195,166,.35))}
#splash .cl{fill:rgba(95,195,166,0);stroke:#5fc3a6;stroke-width:2.6;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:spd 1.3s cubic-bezier(.5,0,.2,1) .15s forwards,spf .8s ease 1.2s forwards}
#splash .ar{fill:none;stroke:#5fc3a6;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;opacity:0;animation:spa .5s ease 1.05s forwards,spu 1.5s ease-in-out 1.6s infinite}
#splash .nm{margin-top:26px;font:600 20px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.42em;padding-left:.42em;color:#bfece0;opacity:0;transform:translateY(8px);animation:spn .7s ease 1.3s forwards}
#splash .dt{display:flex;gap:7px;margin-top:22px;opacity:0;animation:spn .5s ease 1.6s forwards}
#splash .dt i{width:6px;height:6px;border-radius:50%;background:#5fc3a6;animation:spb 1s ease-in-out infinite}
#splash .dt i:nth-child(2){animation-delay:.15s}#splash .dt i:nth-child(3){animation-delay:.3s}
@keyframes spd{to{stroke-dashoffset:0}}
@keyframes spf{to{fill:rgba(95,195,166,.12)}}
@keyframes spa{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spu{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes spn{to{opacity:1;transform:none}}
@keyframes spb{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes spr{0%{opacity:.55;transform:scale(.7)}100%{opacity:0;transform:scale(1.55)}}
@media(prefers-reduced-motion:reduce){#splash *,#splash *::before,#splash *::after{animation-duration:.01s!important;animation-delay:0s!important}}
#crumbs{flex:1;min-width:0;padding:0 4px}
#tools{display:flex;align-items:center;gap:2px;flex:none;overflow:hidden;max-width:0;transition:max-width .32s cubic-bezier(.2,.8,.2,1)}
#top.tl #tools{max-width:310px}
#dp #conb,#conb{display:none!important}body.own #dp #conb{display:flex!important}
#fsec,#lkf,#rnf,#mvf,#cpf,#delf{display:none!important}
.dgrp{padding:10px 6px 2px;font-size:13px;letter-spacing:.04em;color:#8fb3ab}
.fsn{padding:4px 6px 12px;color:var(--mute);font:14px system-ui,sans-serif}
#tools .ib2{opacity:0;transform:translateX(36px) scale(.5);transition:transform .34s cubic-bezier(.3,1.5,.5,1),opacity .2s}
#top.tl #tools .ib2{opacity:1;transform:none}
#top.tl #tools .ib2:nth-last-child(1){transition-delay:.02s}#top.tl #tools .ib2:nth-last-child(2){transition-delay:.06s}#top.tl #tools .ib2:nth-last-child(3){transition-delay:.1s}#top.tl #tools .ib2:nth-last-child(4){transition-delay:.14s}#top.tl #tools .ib2:nth-last-child(5){transition-delay:.18s}
#tgl{color:var(--acc);border:1px solid var(--acc);width:36px;height:36px;margin-left:4px}
#tgl .i{transition:transform .3s}#top.tl #tgl .i{transform:rotate(180deg)}

#crumbs .chip{padding:5px 11px;font-size:13px}
#sortm{position:absolute;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:210px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#fltm{position:absolute;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:200px;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:15}
#fltm button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-radius:0;background:none;padding:11px 14px;font-size:15px}
#fltb.on{color:var(--acc)}
#sortm button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-radius:0;background:none;padding:11px 14px;font-size:15px}
#sq{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:0 4px 0 14px;margin:4px 0 8px;font:14px system-ui,sans-serif}
#sqt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--accink);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:4;cursor:pointer}
.fab .i{width:26px;height:26px}
#drawer{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.5)}
#dp{width:min(300px,85vw);height:100%;background:var(--card);padding:14px;padding-top:max(14px,env(safe-area-inset-top));overflow:auto}
#dp.anim{animation:dsl .2s}
main{touch-action:pan-y}
#crumbs{touch-action:pan-x pan-y}
@keyframes dsl{from{transform:translateX(-100%)}}
#dp button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:12px 8px;font-size:16px;border-radius:8px}
#dp input{margin:0 0 8px}
.del{color:var(--bad)}
[hidden]{display:none!important}
#st{display:none}
.lockbtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom));width:68px;height:68px;display:flex;align-items:center;justify-content:center;padding:0;border:1px solid color-mix(in srgb,var(--acc) 28%,transparent);border-radius:50%;background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--acc);box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 10%,transparent),0 6px 18px rgba(0,0,0,.45);z-index:4;cursor:pointer;transition:transform .12s}
.lockbtn:active{transform:translateX(-50%) scale(.94)}
.lockbtn::before{content:"";position:absolute;inset:-1px;border-radius:50%;padding:3px;background:conic-gradient(from 0deg,transparent 0 60%,var(--acc) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:lkspin 5s linear infinite;pointer-events:none}
@keyframes lkspin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.lockbtn::before{animation:none}}
.lockbtn .lk{display:flex;align-items:center;justify-content:center}
.lockbtn svg{width:28px;height:28px}
.lockbtn .lt{display:none}
body.lk-sl .lockbtn{width:min(340px,calc(100% - 36px));height:60px;border-radius:99px;background:var(--card);border:1px solid var(--line);box-shadow:none;touch-action:none;user-select:none;-webkit-user-select:none}
body.lk-sl .lockbtn:active{transform:translateX(-50%)}
body.lk-sl .lockbtn::before{display:none}
body.lk-sl .lockbtn .lt{display:block;font:500 15px system-ui,sans-serif;color:var(--mute);padding-left:46px;pointer-events:none}
body.lk-sl .lockbtn .lk{position:absolute;left:5px;top:5px;width:48px;height:48px;border-radius:50%;background:var(--acc);color:var(--accink);touch-action:none}
body.lk-sl .lockbtn .lk.snap{transition:transform .2s}

/* ---- перемешивание ----
   Настоящая «колода»: все треки очереди выстраиваются в случайном порядке один раз, и играют по этому порядку —
   пока не прозвучат все, ни один не повторяется. Когда колода кончилась: при «Повтор: все» тасуется новая
   (первый трек новой колоды не равен последнему прошлой), иначе воспроизведение останавливается. */
function shufOrder(len,first,rnd=Math.random){
  const a=[];for(let i=0;i<len;i++)if(i!==first)a.push(i);
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return first>=0&&first<len?[first,...a]:a;
}
/* sh={o:[порядок],p:позиция,len}: подгоняем под трек i, который сейчас включили (следующий, предыдущий или любой другой) */
function shSync(sh,i,len,rnd=Math.random){
  if(sh.len===len&&sh.o[sh.p]===i)return;
  if(sh.len===len&&sh.o[sh.p+1]===i){sh.p++;return}
  if(sh.len===len&&sh.p>0&&sh.o[sh.p-1]===i){sh.p--;return}
  sh.len=len;sh.o=shufOrder(len,i,rnd);sh.p=0;
}
/* Какие треки идут следом (индексы в очереди). sh изменяется на месте. */
function aheadIdx(pi,len,shuf,repm,sh,n,rnd=Math.random){
  if(pi<0||len<1)return[];
  if(shuf&&len>1){
    shSync(sh,pi,len,rnd);
    if(repm===1)while(sh.o.length-sh.p-1<n){
      const last=sh.o[sh.o.length-1],a=shufOrder(len,-1,rnd);
      if(a[0]===last)[a[0],a[1]]=[a[1],a[0]];
      sh.o.push(...a);
    }
    if(sh.p>2*len){sh.o.splice(0,len);sh.p-=len}
    return sh.o.slice(sh.p+1,sh.p+1+n);
  }
  const out=[];
  for(let j=1;j<=n;j++){const k=pi+j;if(k<len)out.push(k);else if(repm===1){const w=k%len;if(w!==pi&&!out.includes(w))out.push(w)}else break}
  if(!out.length&&repm===1&&len===1)out.push(0);
  return out;
}

let OWNPRIV=null;
async function setupOwnerKey(){
  if(!hasCrypto()){alert('Недоступно: при таком способе открытия файла браузер не даёт доступ к криптографии. Откройте файл через file:// или с хостинга.');return}

  const kp=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);
  const pub=await crypto.subtle.exportKey('jwk',kp.publicKey),pk=new Uint8Array(await crypto.subtle.exportKey('pkcs8',kp.privateKey)),salt=crypto.getRandomValues(new Uint8Array(16)),k=await deriveKey(a,salt),w=b64e(await aesE(k,pk));
  const m=await withChat(()=>client.sendMessage(S.chat,OKR+JSON.stringify({pub,s:b64e(salt),w})));
  ownkey={id:m.id,pub,s:b64e(salt),w};OWNPRIV=kp.privateKey;jlog('own','');say('Хранение паролей включено');drawUsers();
}
async function unlockOwner(){
  if(OWNPRIV)return true;if(!ownkey)return false;
  const a=await askPass('Мастер-пароль владельца');if(a===null)return false;
  try{const k=await deriveKey(a,b64d(ownkey.s));OWNPRIV=await crypto.subtle.importKey('pkcs8',await aesD(k,b64d(ownkey.w)),{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']);await jDecryptAll();return true}
  catch(e){alert('Неверный мастер-пароль');return false}
}
async function encPw(pw){
  if(!ownkey||!hasCrypto())return '';
  try{const pk=await crypto.subtle.importKey('jwk',ownkey.pub,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);return b64e(new Uint8Array(await crypto.subtle.encrypt({name:'RSA-OAEP'},pk,te.encode(pw))))}catch(e){return ''}
}
async function jpack(b){
  if(!ownkey)return JR+JSON.stringify(b);
  if(!hasCrypto())return '';
  try{
    const pk=await crypto.subtle.importKey('jwk',ownkey.pub,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);
    const ak=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']);
    const wk=new Uint8Array(await crypto.subtle.encrypt({name:'RSA-OAEP'},pk,await crypto.subtle.exportKey('raw',ak)));
    return JR+JSON.stringify({k:b64e(wk),d:b64e(await aesE(ak,te.encode(JSON.stringify(b))))});
  }catch(e){return ''}
}
async function jDecryptAll(){
  if(!OWNPRIV||!JENC.length)return;
  const rest=[];
  for(const x of JENC){
    try{
      const raw=await crypto.subtle.decrypt({name:'RSA-OAEP'},OWNPRIV,b64d(x.k)),ak=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
      for(const e of JSON.parse(td.decode(await aesD(ak,b64d(x.d)))))JOUR.push({...e,mid:x.mid});
    }catch(e){rest.push(x)}

}

  const mids=[...new Set(old.map(e=>e.mid))],fresh=[];
  for(let i=0;i<old.length;i+=6){
    const b=old.slice(i,i+6).map(({t,u,a,d})=>({t,u,a,d})),p=await jpack(b);if(!p)throw new Error('Не удалось зашифровать журнал');

}

  n.value=p.value=q.value='';er.textContent='';R.hidden=false;R.scrollTop=0;setTimeout(()=>n.focus(),80);
  let busy=false;
  const done=v=>{R.hidden=true;ok.onclick=null;[n,p,q].forEach(i=>i.onkeydown=null);p.value=q.value='';res(v)};
  const go=async()=>{
    if(busy)return;busy=true;ok.disabled=true;er.textContent='';
    try{const m=await check(n.value.trim(),p.value,q.value);if(m){er.textContent=m;return}done(true)}
    catch(x){er.textContent=err(x)}
    finally{busy=false;ok.disabled=false}
  };
  ok.onclick=go;
  n.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();p.focus()}};
  p.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();q.focus()}};
  q.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};
})}

  S.guestUser='';S.guestHash='';
  const ok=await regScreen(async(raw,a,b)=>{

    if(!/^[\p{L}\p{N}_.-]{2,24}$/u.test(name))return 'Имя: от 2 до 24 символов, буквы, цифры, _ . -';
    const ex=users.find(x=>x.u.toLowerCase()===name.toLowerCase());

      if(!a)return 'Введите пароль';

const KEYS={};let _dd=0;
const hasCrypto=()=>!!(window.crypto&&crypto.subtle);
async function deriveKey(pw,salt){const km=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}

const keyRaw=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
/* Пароль шифрования открывает «обёртку» (e.w) с ключом файлов, поэтому смена пароля не требует перешифровывать файлы.
   Старые репозитории без e.w работают как раньше: ключ файлов = ключ из пароля. Бросает ошибку при неверном пароле. */
async function openEnc(pw,e){
  const salt=b64d(e.s),K=await deriveKey(pw,salt);await aesD(K,b64d(e.c));
  if(!e.w)return{dk:K,raw:null,salt};
  const raw=await aesD(K,b64d(e.w));return{dk:await keyRaw(raw),raw,salt};
}
async function aesD(key,u8,aad){const p={name:'AES-GCM',iv:u8.subarray(0,12)};if(aad)p.additionalData=aad;return new Uint8Array(await crypto.subtle.decrypt(p,key,u8.subarray(12)))}

async function encBytes(r,f){
  const key=KEYS[r],CH=1<<20,len=f.size,n=Math.max(1,Math.ceil(len/CH)),out=new Uint8Array(4+len+n*32),dv=new DataView(out.buffer);
  out.set([84,71,69,50]);let p=4;
  for(let i=0;i<n;i++){const part=new Uint8Array(await f.slice(i*CH,(i+1)*CH).arrayBuffer()),c=await aesE(key,part,chunkAad(i,n));dv.setUint32(p,c.length);out.set(c,p+4);p+=4+c.length}
  return out;
}
async function decBlob(f,parts){
  const key=KEYS[f.repo];if(!key)throw new Error('Нет ключа шифрования');
  const all=await new Blob(parts).arrayBuffer(),u=new Uint8Array(all),dv=new DataView(all);
  const v2=u[0]===84&&u[1]===71&&u[2]===69&&u[3]===50,v1=u[0]===84&&u[1]===71&&u[2]===69&&u[3]===49;
  if(!v1&&!v2)throw new Error('Неизвестный формат шифрования');
  const fr=[];let p=4;
  while(p<u.length){const L=dv.getUint32(p);if(p+4+L>u.length)throw new Error('Файл повреждён (обрезан)');fr.push(u.subarray(p+4,p+4+L));p+=4+L}

  for(let i=0;i<fr.length;i++)out.push(await aesD(key,fr[i],v2?chunkAad(i,fr.length):undefined));

}

/* быстрое чтение: страницы по 100 сообщений запрашиваются сразу по несколько штук, а не одна за другой.
   Окно с offsetId=o отдаёт до 100 сообщений старше o, поэтому окна с шагом 100 вместе покрывают весь канал.
   Если что-то пошло не так, вызывающий код читает архив по-старому, последовательно. */
async function readFast(prog){
  const first=await withChat(()=>client.getHistory(S.chat,{limit:100}));
  if(!first.length)return[];
  const all=new Map();for(const m of first)all.set(m.id,m);
  const low=Math.min(...first.map(m=>m.id)),offs=[];
  for(let o=low;o>1;o-=100)offs.push(o);
  let k=0,fail=null;
  const worker=async()=>{
    while(!fail){
      const j=k++;if(j>=offs.length)return;
      let b=null;
      for(let t=0;t<3&&!b;t++){
        try{b=await withChat(()=>client.getHistory(S.chat,{limit:100,offsetId:offs[j]}))}
        catch(e){
          const m=/FLOOD_WAIT\D{0,12}(\d+)|wait of (\d+)/i.exec(err(e)),w=m?+(m[1]||m[2]):0;
          if(w>30||t>=2){fail=e;return}
          await sleep(w?(w+1)*1000:1200*(t+1));
        }
      }
      if(!b){fail=new Error('пустой ответ');return}
      for(const m of b)all.set(m.id,m);
      if(prog)prog(all.size);
    }
  };
  await Promise.all([worker(),worker(),worker(),worker()]);
  if(fail)throw fail;
  return[...all.values()].sort((x,y)=>y.id-x.id);
}

async function cGet(id){

    if(!r||!r.blob)return null;

async function cPurge(cap=Infinity){

   Каждый файл качается одной общей задачей: если плеер и просмотр просят один файл — это одна загрузка.

function dlRaw(f,pre){

  const gone=new Promise((_,rej)=>{j.cancel=()=>{if(j.stop)return;j.stop=true;rej(new Error('Отменено'))}});gone.catch(()=>{});

async function enqueue(fs){

  const items=fs.map(f=>({f,path:pp,repo:rr,enc:en})),add=fs.reduce((a,f)=>a+f.size,0);

async function runPool(){

  }));

  if(needRef){needRef=false;try{await refresh()}catch(x){}}
  U.on=false;U.jobs.clear();U.byPid.clear();upPaint();render();saveIndex();
  const failed=UF.slice();UF=[];
  ulog(was?`Загрузка отменена. Успешно: ${U.ok}`:`Загрузка завершена. Успешно: ${U.ok}, с ошибкой: ${failed.length}`);
  say(was?`Отменено. Загружено файлов: ${U.ok}`:`Готово: загружено файлов — ${U.ok}`+(failed.length?`, не загружено — ${failed.length}`:''),failed.length&&!was);
  if(failed.length&&!was&&confirm(`Не загрузилось файлов: ${failed.length}\n${failed.slice(0,5).map(x=>x.f.name).join('\n')}\n\nПовторить?`)){

  const add=items.reduce((a,x)=>a+x.f.size,0);let m=0;for(const x of files)if(x.no>m)m=x.no;

  U.jobs.clear();U.byPid.clear();UQ=items.slice();UF=[];needRef=false;
  keepAwake(true);U.tick=setInterval(upPaint,1000);upPaint();runPool();
}

async function runJob(it){
  const f=it.f,job={name:f.name,size:f.size,cur:0,got:false,lastP:Date.now(),t0:Date.now(),ctl:null};
  U.jobs.add(job);U.lastP=Date.now();upPaint();
  const no=U.nextNo++;ulog(`▶ Начинаю: ${f.name} · ${size(f.size)}${it.enc?' · с шифрованием':''}${it.path?' · папка '+it.path:''}`);let done=false,floods=0;
  for(let a=1;a<=3&&!done&&!U.cancel;a++){
    job.cur=0;job.q=0;job.got=false;job.lastP=Date.now();job.t0=Date.now();
    ulog(`Попытка ${a} из 3: ${f.name}`);
    U.retry=a>1?`Повтор ${a} из 3: ${f.name}`:'';
    let timer=0,pv;
    try{
      try{pv=await Promise.race([client.getProgressId(),new Promise(r=>setTimeout(()=>r(undefined),5000))])}catch(x){pv=undefined}
      ulog(pv!==undefined?'Получен номер загрузки':'Номер загрузки не получен за 5 с, иду без него');
      if(pv!==undefined)U.byPid.set(String(pv),job);
      const big=f.size>1.5e8&&!it.enc;
      if(it.enc&&f.size>3e8)throw new Error('Файл больше 300 МБ нельзя зашифровать');
      ulog(it.enc?'Шифрую и читаю файл…':big?'Большой файл: отправляю потоком':'Читаю файл…');
      let data=it.enc?await encBytes(it.repo,f):big?f.stream():new Uint8Array(await f.arrayBuffer());
      ulog('Файл подготовлен, отправляю в Telegram');
      const ctl=new AbortController();job.ctl=ctl;
      let kill;const dead=new Promise((_,rej)=>{kill=rej});dead.catch(()=>{});
      job.abort=()=>{try{ctl.abort()}catch(e){}kill(new Error('Нет ответа от Telegram'))};
      timer=setInterval(()=>{
        const now=Date.now(),hi=job.cur>=.99;
        if(job.got&&now-job.lastP>(hi?240000:40000)){ulog(`⏱ Нет движения ${Math.round((now-job.lastP)/1000)} с${hi?' (после 100%)':''}: обрываю попытку`);job.abort()}
        else if(now-job.t0>60000+f.size/40+(hi?240000:0)){ulog('⏱ Вышло общее время попытки: обрываю');job.abort()}
      },3000);
      const eN=it.enc?await encName(it.repo,f):null;
      const o={caption:caption(no,it.path,eN?'🔐'+eN:f.name,it.repo),fileName:eN?'enc'+no+'.bin':f.name,signal:ctl.signal};
      if(big)o.fileSize=f.size;
      if(pv!==undefined)o.progressId=pv;
      const sp=withChat(()=>client.sendDocument(S.chat,data,o));sp.catch(()=>{});
      const r=await Promise.race([sp,dead]);
      data=null;done=true;
      const en=entry(r);
      ulog(en?`✔ Загружен: ${f.name}`:`✔ Telegram принял ${f.name}, список обновлю в конце`);
      if(en){if(!en.no)en.no=no;files.push(en)}else needRef=true;
      jlog('up',(it.enc?'зашифрованный файл':f.name)+' → '+(it.repo||'Облако')+(it.path?' / '+it.path:''));
      scheduleRender();saveIndex();
    }catch(x){
      ulog(U.cancel?`Отменено: ${f.name}`:`✖ Ошибка: ${err(x)}`);
      if(U.cancel)break;
      if(/Подпись слишком/.test(err(x)))break;
      if(job.cur>=.98){
        let e=null;
        ulog('Передано 100%: проверяю, есть ли файл в канале');
        for(let k=0;k<5&&!e&&!U.cancel;k++){e=await sentAlready(it,no);ulog(e?`Проверка ${k+1}: файл найден`:`Проверка ${k+1}: файла в канале пока нет`);if(!e)await sleep(4000)}   /* файл дошёл до 100%: даём Telegram дозаписать его и ищем в канале */
        if(e){files.push(e);done=true;jlog('up',(it.enc?'зашифрованный файл':f.name)+' → '+(it.repo||'Облако')+(it.path?' / '+it.path:''));scheduleRender();break}
      }
      const msg=err(x),m=/(?:FLOOD_WAIT|wait of|wait for)\D{0,12}(\d{1,5})/i.exec(msg);
      if(m&&floods<5){
        floods++;a--;ulog(`Telegram просит подождать ${m[1]} с`);
        for(let sec=Math.min(+m[1],180);sec>0&&!U.cancel;sec--){U.waitMsg=`Telegram просит подождать: ещё ${sec} с`;upPaint();await sleep(1000)}
        U.waitMsg='';
      }else if(a<3){ulog(`Повтор через ${a*2.5} с`);await sleep(a*2500)}
    }finally{clearInterval(timer);if(pv!==undefined)U.byPid.delete(String(pv))}
  }
  U.jobs.delete(job);U.fin++;U.done+=f.size;U.retry='';
  if(done)U.ok++;else if(!U.cancel){UF.push(it);ulog(`✖ НЕ ЗАГРУЖЕН: ${f.name}`)}
  upPaint();
}

function runStream(f,v,url0,size0){
  let url=url0,size=size0,swapping=false,finalDone=false;
  const chip=document.createElement('div');chip.className='dlchip';stg.appendChild(chip);
  const swap=(nu,ns)=>{
    const t=v.currentTime,was=!v.paused,old=url;swapping=true;url=nu;size=ns;
    v.addEventListener('loadedmetadata',()=>{try{v.currentTime=t}catch(e){}if(was)v.play().catch(()=>{});swapping=false;setTimeout(()=>{if(old!==C.get(f.id))try{URL.revokeObjectURL(old)}catch(e){}},1500)},{once:true});
    v.src=nu;
  };
  const tick=setInterval(()=>{
    if(openId!==f.id||!v.isConnected){clearInterval(tick);if(url!==C.get(f.id))try{URL.revokeObjectURL(url)}catch(e){};return}
    if(swapping)return;
    const dur=isFinite(v.duration)?v.duration:0,b=v.buffered,bend=b.length?b.end(b.length-1):0;
    const est=dur&&f.size?dur*size/f.size:bend,runway=Math.min(est,bend||est)-v.currentTime;
    if(C.has(f.id)){
      if(!finalDone&&(v.paused||v.ended||v.error||runway<15)){finalDone=true;chip.remove();swap(C.get(f.id),f.size)}
      return;
    }
    const have=DLP.get(f.id)||0;
    chip.textContent='Подгружается: '+Math.round(have/1e6)+' из '+Math.round(f.size/1e6)+' МБ';
    if((runway<8||v.ended||v.error)&&have>size*1.3&&SNAP.has(f.id)){const sn=SNAP.get(f.id)();swap(URL.createObjectURL(sn),sn.size)}
  },500);
}

const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
let t0=null,pin=null,lastTap=0,tapTm;
stg.addEventListener('touchstart',e=>{
  if(!media()){
    t0=null;
    if(e.touches.length!==1)return;
    const t=e.touches[0],r=stg.getBoundingClientRect(),el=stg.firstElementChild;
    if(el&&el.matches('video')&&t.clientY>r.bottom-130)return;
    t0={x:t.clientX,y:t.clientY,plain:true};return;
  }
  if(e.touches.length===2){pin={d:dist(e.touches),s:z.s};t0=null;return}
  if(e.touches.length===1){const t=e.touches[0];t0={x:t.clientX,y:t.clientY,zx:z.x,zy:z.y,t:Date.now(),mv:false}}
},{passive:true});
stg.addEventListener('touchmove',e=>{
  const m=media();if(!m)return;
  if(pin&&e.touches.length===2){z.s=Math.min(5,Math.max(1,pin.s*dist(e.touches)/pin.d));applyZ();return}
  if(!t0||e.touches.length!==1)return;
  const t=e.touches[0],dx=t.clientX-t0.x,dy=t.clientY-t0.y;
  if(Math.abs(dx)+Math.abs(dy)>10)t0.mv=true;
  if(z.s>1){z.x=t0.zx+dx;z.y=t0.zy+dy;applyZ()}
  else{m.style.transition='none';m.style.transform=Math.abs(dy)>Math.abs(dx)*1.2&&dy>0?`translateY(${dy}px)`:`translateX(${dx}px)`}
},{passive:true});
stg.addEventListener('touchend',e=>{
  const m=media();
  if(!m){
    if(!t0||!t0.plain){t0=null;return}
    const t=e.changedTouches[0],dx=t.clientX-t0.x,dy=t.clientY-t0.y;t0=null;
    const el0=stg.firstElementChild;
    if(dy>130&&dy>Math.abs(dx)*1.8&&el0&&el0.matches('video,.vl')){closeV();return}
    const d=dx<0?1:-1;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5&&curList[vi+d]!==undefined)showAt(vi+d,d);
    return;
  }
  if(pin){if(e.touches.length<2){pin=null;if(z.s<1.05)z={s:1,x:0,y:0};applyZ(true)}return}
  if(!t0)return;
  const t=e.changedTouches[0],dx=t.clientX-t0.x,dy=t.clientY-t0.y,o=t0;t0=null;
  if(!o.mv&&Date.now()-o.t<300){
    const now=Date.now();
    if(now-lastTap<300){clearTimeout(tapTm);lastTap=0;z=z.s>1?{s:1,x:0,y:0}:{s:2.5,x:0,y:0};applyZ(true)}
    else{lastTap=now;tapTm=setTimeout(()=>$('#vw').classList.toggle('hide'),300)}
    return;
  }
  if(z.s===1&&dy>110&&dy>Math.abs(dx)*1.6){closeV();return}
  const d=dx<0?1:-1;
  if(z.s===1&&Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.2&&curList[vi+d]!==undefined){showAt(vi+d,d);return}
  applyZ(true);
},{passive:true});

let guarded=false;const HB=6;
/* в истории браузера держим запас записей: каждое нажатие «назад» съедает одну, а мы тут же докладываем новую.

const hIdx=()=>{const st=history.state;return st&&st.g==='s'?st.i:-1};
